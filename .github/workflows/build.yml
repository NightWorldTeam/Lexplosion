name: Build

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Lexplosion (no tests)
        env:
          SolutionDir: ${{ github.workspace }}\src\
        run: dotnet build src/Lexplosion.UI.WPF/Lexplosion.UI.WPF.csproj
