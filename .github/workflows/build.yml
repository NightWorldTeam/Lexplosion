name: Build Lexplosion

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build launcher
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Core creates the ZIP that WPF needs during its build.
      - name: Build Core
        run: dotnet build src/Lexplosion.Core/Lexplosion.Core.csproj -c Release "-p:SolutionDir=$env:GITHUB_WORKSPACE/src/"

      - name: Verify Core ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/src/DLL/Lexplosion.Core.zip")) {
            throw "Lexplosion.Core.zip was not generated by the Core build."
          }

      - name: Build WPF launcher
        run: dotnet build src/Lexplosion.UI.WPF/Lexplosion.UI.WPF.csproj -c Release "-p:SolutionDir=$env:GITHUB_WORKSPACE/src/"

      # Debug contains opt-in UI diagnostics, excluded from Release.
      - name: Compile Debug UI telemetry
        run: dotnet build src/Lexplosion.UI.WPF/Lexplosion.UI.WPF.csproj -c Debug "-p:SolutionDir=$env:GITHUB_WORKSPACE/src/"

  tests:
    name: NUnit tests
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Jobs use separate runners; the Core ZIP is not shared with build.
      - name: Build Core for tests
        run: dotnet build src/Lexplosion.Core/Lexplosion.Core.csproj -c Release "-p:SolutionDir=$env:GITHUB_WORKSPACE/src/"

      - name: Verify Core ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/src/DLL/Lexplosion.Core.zip")) {
            throw "Lexplosion.Core.zip was not generated by the Core build."
          }

      - name: Build test project
        run: dotnet build src/Lexplosion.Tests/Lexplosion.Tests.csproj -c Release "-p:SolutionDir=$env:GITHUB_WORKSPACE/src/"

      - name: Run NUnit tests
        run: dotnet test src/Lexplosion.Tests/Lexplosion.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # Build-check FlaUI scenarios without driving a headless Windows runner.
      - name: Compile E2E tests (do not execute without interactive desktop)
        run: dotnet build src/Lexplosion.E2E/Lexplosion.E2E.csproj -c Release
